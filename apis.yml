name: Clutch Learning
description: Clutch Learning (Clutch Prep) was a Miami-based education-technology startup founded in 2011
  that helped more than two million college students learn through thousands of short-form, topic-based
  video tutorials and practice problems across subjects such as chemistry, physics, biology, accounting,
  and calculus. Backed by 500 Global (500 Startups), the company was acquired by Pearson in 2022 and folded
  into the Pearson+ study platform, where the offering now lives as Pearson Channels. The standalone
  clutchprep.com product is no longer independently operated. The domain 301-redirects to
  pearson.com/channels, and the company exposes no independent developer portal, public API, SDKs, or
  event surface. This profile is retained in the API Evangelist network as an acquired-company record.
